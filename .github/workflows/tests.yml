name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-cpu.txt
            pyproject.toml

      - name: Dépendances (PyTorch CPU)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cpu.txt
          pip install -e ".[dev,api]"

      - name: Fichiers du modèle (release v1.1, en cache)
        uses: actions/cache@v4
        with:
          path: ~/.cache/rootseg
          key: rootseg-weights-v1.1

      - name: Tests
        run: pytest -q
